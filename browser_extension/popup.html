<!DOCTYPE html>
<html>
<head>
  <style>
    body { width: 200px; padding: 10px; font-family: sans-serif; background: #1a1a1a; color: white; }
    h2 { font-size: 14px; margin-top: 0; color: #22c55e; }
    .status { font-size: 12px; margin-bottom: 10px; }
    .dot { height: 8px; width: 8px; background-color: #bbb; border-radius: 50%; display: inline-block; margin-right: 5px; }
    .connected { background-color: #22c55e; }
    .disconnected { background-color: #ef4444; }
  </style>
</head>
<body>
  <h2>EmploAI Bridge</h2>
  <div class="status">
    <span class="dot" id="status-dot"></span>
    <span id="status-text">Connecting...</span>
  </div>
  <p style="font-size: 10px;">This extension connects your browser to the Telegram Agent.</p>
</body>
</html>
