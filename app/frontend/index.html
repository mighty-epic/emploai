<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <div class="app">
        <!-- Header -->
        <header class="header">
            <h1>AI Chat</h1>
            <div class="controls">
                <select id="model-select">
                    <option value="claude-sonnet-4.5">Claude Sonnet 4.5 (Thinking)</option>
                    <option value="claude-opus-4.5">Claude Opus 4.5 (Thinking)</option>
                    <option value="claude-sonnet-4">Claude Sonnet 4 (Thinking)</option>
                    <option value="claude-opus-4">Claude Opus 4 (Thinking)</option>
                    <option value="claude-sonnet-3.5">Claude Sonnet 3.5</option>
                    <option value="claude-haiku-3.5">Claude Haiku 3.5 (Fast)</option>
                </select>

                <label class="toggle">
                    <input type="checkbox" id="agent-toggle">
                    <span class="toggle-label">Agent Mode</span>
                </label>

                <button id="reset-btn" class="btn-reset">Reset</button>
            </div>
        </header>

        <!-- Chat Container -->
        <main class="chat-container" id="chat-container">
            <div class="welcome-message">
                <p>Start a conversation or enable <strong>Agent Mode</strong> to execute tasks.</p>
            </div>
        </main>

        <!-- Input Area -->
        <footer class="input-area">
            <textarea id="message-input" placeholder="Type a message..." rows="1"></textarea>
            <button id="send-btn" class="btn-send">Send</button>
        </footer>
    </div>

    <script src="/static/app.js"></script>
</body>

</html>
